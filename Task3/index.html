<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video/Audio</title>
</head>
<body>
    <h2>Video</h2>
    <video width="500px" height="240px" controls autoplay loop >
        <source src="tiny.mp4" type="video/mp4">
    </video>
    <br><br>
    <hr>

    <h2>Audio</h2>
    <audio controls>
        <source src="synthwave.mp3" type="audio/mpeg">
    </audio>

    
</body>
</html>
